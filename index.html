<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev-Conf 2026</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!-- navbar v-1 -->
    <header class="header">
        <nav class="navbar">

            <div class="logo">
                <img id="logo-img" src="./assets/logo.png" alt="Dev-Conf Logo" srcset="">
            </div>

            <div class="menu">
                <ul class="menu-list">
                    <li><button class="menu-btns">Speakers</button></li>
                    <li><button class="menu-btns">Schedule</button></li>
                    <li><button class="menu-btns">Tracks</button></li>
                    <li><button class="menu-btns">Venue</button></li>
                    <li><button class="menu-btns">Blog</button></li>
                </ul>
            </div>

            <div class="register">
                <button class="common-btn">Register</button>
            </div>
        </nav>
    </header>

    <!-- navbar v-1 ends -->

    <!-- hero-banner starts -->
    <main class="hero-section centering-div">
        <div>
            <h1 style="font-weight: 800; font-size:50px;">Code, <i>Connect,</i> Create ;</h1>
            <p style="margin-top:3%;">Join 4,000+ engineers, founders, and builders at the premier developer conference
                of 2026. Three days of
                cutting-edge talks, hands-on workshops, and meaningful connections.</p>
            <button class="common-btn" style="margin-top: 5rem; padding: 0.7rem 1rem;">Register</button>
        </div>
    </main>
    <!-- hero-banner ends -->
</body>

</html>
